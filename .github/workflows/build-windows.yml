name: Build Spektra Product Collector Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "product_editor.py"
      - "requirements.txt"
      - "shoptet_importer/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Spektra-Product-Collector app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spektra-Product-Collector-Windows
          path: dist/Spektra-Product-Collector.exe
          retention-days: 30
